[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quest-jittor-reproduction"
version = "0.1.0"
description = "Small-data QueST reproduction and PyTorch/Jittor alignment tooling"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
